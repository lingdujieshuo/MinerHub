<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinerHub 矿场</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23f5b301'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e13;--bg2:#0f141b;--panel:#131a23;--panel2:#18212c;--line:#222d3a;--line2:#2c3a4b;
  --text:#dbe3ec;--muted:#7f8c9c;--dim:#5a6676;--accent:#f5b301;--accent2:#ffcf4a;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#3b82f6;--radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{font-family:var(--mono);font-size:12.5px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);color:#141006;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#141006}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.mono{font-family:var(--mono)}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.3px}
.logo svg{width:24px;height:24px}
.logo small{font-weight:400;color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600;margin-left:4px}
.chip.hs b{color:var(--accent2)}
nav{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav a.on{color:var(--accent2);border-color:var(--accent)}
main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .sp{flex:1}
h2{font-size:16px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}

/* rigs */
.rig{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.rig.off{opacity:.62}
.rig-head{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.dot.mining{background:var(--ok);box-shadow:0 0 10px rgba(34,197,94,.6)}
.dot.zero{background:var(--warn)}.dot.stopped{background:var(--info)}.dot.hot{background:var(--bad)}
.rig-title{min-width:180px;flex:1;cursor:pointer}
.rig-title b{font-size:15px}
.rig-title small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.tag{display:inline-block;padding:0 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);font-size:11.5px;margin-right:4px;color:var(--muted)}
.tag.algo{color:var(--accent2);border-color:#4d3d0a;background:#231c06}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi label{display:block;font-size:11px;color:var(--muted)}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi b.hs{color:var(--accent2)}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.gpus{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;padding:0 14px 13px}
.gpu{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-variant-numeric:tabular-nums}
.gpu .t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.gpu .t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.gpu .h{font-weight:600;font-size:13.5px;margin:2px 0;color:var(--text)}
.gpu .m{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.gpu.nohs .h{color:var(--warn)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .btn{margin-top:14px}

/* tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--panel2)}
td{font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,255,255,.015)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
.tbl td.wrap{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drawer */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1000px,100vw);background:var(--bg);border-left:1px solid var(--line2);z-index:41;
  transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dhead h3{margin:0;font-size:17px}
.subtabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs a{padding:8px 13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs a.on{color:var(--accent2);border-color:var(--accent)}
.dbody{flex:1;overflow:auto;padding:16px 18px 40px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px;margin-bottom:16px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.kv label{display:block;font-size:11px;color:var(--muted)}
.kv span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre.out{background:#06090d;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:62vh;overflow:auto;margin:10px 0 0;color:#c9d4df}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.chart h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.chart svg{width:100%;height:180px;display:block}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.6);padding:5vh 16px;overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.mbody{padding:16px 18px}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.f{margin-bottom:12px}
.f>label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.f .hint{font-size:11.5px;color:var(--dim);margin-top:3px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px}
.preview{background:#06090d;border:1px dashed var(--line2);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);color:#9fb0c2;word-break:break-all;white-space:pre-wrap}
.note{background:#1a1606;border:1px solid #3d3110;color:#e8d9a6;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* login + toast */
#login{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at top,#1a1406 0%,var(--bg) 55%);display:none;align-items:center;justify-content:center;padding:20px}
#login.on{display:flex}
#login .box{width:min(360px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:28px}
#login .logo{justify-content:center;font-size:22px;margin-bottom:20px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tm{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 16px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:13.5px}
.tm.err{border-color:var(--bad);color:#fecaca}.tm.okk{border-color:var(--ok)}
.lvl{display:inline-block;width:46px;font-size:11.5px;text-align:center;border-radius:4px;padding:0 4px;margin-right:6px}
.lvl.info{background:#10233f;color:#93c5fd}.lvl.warn{background:#3a2a07;color:#fcd34d}.lvl.error{background:#3d1010;color:#fca5a5}
@media (max-width:700px){.kpis{gap:14px}.hwrap{padding:10px 14px}main{padding:14px 12px 60px}.rig-head{gap:9px}}
</style>
</head>
<body>

<div id="login"><div class="box">
  <div class="logo"><svg viewBox="0 0 32 32"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="#f5b301"/><path d="M16 9l6 3.5v7L16 23l-6-3.5v-7z" fill="#0a0e13"/></svg>MinerHub</div>
  <div class="f"><label>管理员密码</label><input type="password" id="lpw" autofocus></div>
  <button class="btn primary" style="width:100%" id="lbtn">登录</button>
  <div class="muted" style="font-size:12px;margin-top:12px;text-align:center">忘记密码：在面板服务器执行 server.py passwd 新密码</div>
</div></div>

<header>
  <div class="hwrap">
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="#f5b301"/><path d="M16 9l6 3.5v7L16 23l-6-3.5v-7z" fill="#0a0e13"/></svg>MinerHub <small id="ver"></small></div>
    <div class="chips" id="chips"></div>
    <span class="muted" style="font-size:12px" id="clock"></span>
    <button class="btn sm" id="logout">退出</button>
  </div>
  <nav id="nav">
    <a data-tab="rigs" class="on">矿机</a><a data-tab="flights">飞行表</a><a data-tab="ocs">超频</a>
    <a data-tab="schedules">定时任务</a><a data-tab="events">事件</a><a data-tab="settings">设置</a>
  </nav>
</header>
<main id="main"></main>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dhead" id="dhead"></div>
  <div class="subtabs" id="dtabs">
    <a data-d="ov" class="on">概况</a><a data-d="cfg">配置</a><a data-d="chart">曲线</a>
    <a data-d="log">矿工日志</a><a data-d="term">终端</a><a data-d="ev">事件</a>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="mtitle"></h3><div class="mbody" id="mbody"></div>
  <div class="mfoot"><button class="btn" id="mcancel">取消</button><button class="btn primary" id="mok">保存</button></div>
</div></div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE = location.pathname.replace(/[^\/]*$/, '');   // 安全入口：/后缀/ 或 /
const S = {st:null, tab:'rigs', sel:new Set(), rid:null, dtab:'ov', det:null, hours:24, cfgDirty:false};
const ACT = {start_miner:'启动挖矿',stop_miner:'停止挖矿',restart_miner:'重启矿工',reboot:'重启系统',shutdown:'关机',wol:'网络唤醒',poweron:'定时开机'};
const DAYN = ['','一','二','三','四','五','六','日'];

function toast(msg, type){ const d=document.createElement('div'); d.className='tm '+(type||''); d.textContent=msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(), type==='err'?5000:2600); }
async function api(path, body){
  const opt = body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const r = await fetch(BASE+'api/'+path, opt);
  if (r.status===401){ showLogin(); throw new Error('请先登录'); }
  const j = await r.json();
  if (j.ok===false) throw new Error(j.error || '操作失败');
  return j;
}
async function act(path, body, okMsg){ try{ const j=await api(path, body); if(okMsg!==false) toast(j.msg||okMsg||'已完成','okk'); return j; }catch(e){ toast(e.message,'err'); throw e; } }

function fmtHs(v){ if(v==null||isNaN(v)) return '—'; const u=['H/s','KH/s','MH/s','GH/s','TH/s','PH/s']; let i=0; v=+v; while(Math.abs(v)>=1000&&i<u.length-1){v/=1000;i++} return (v>=100?v.toFixed(1):v.toFixed(2))+' '+u[i]; }
function fmtDur(s){ s=Math.floor(s||0); if(s<=0) return '—'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d}天${h}时`:h?`${h}时${m}分`:`${m}分`; }
function ago(ts){ if(!ts) return '从未'; const s=Math.floor(Date.now()/1000-ts); return s<60?s+'秒前':s<3600?Math.floor(s/60)+'分钟前':s<86400?Math.floor(s/3600)+'小时前':Math.floor(s/86400)+'天前'; }
function tm(ts){ const d=new Date(ts*1000); return d.toLocaleString('zh-CN',{hour12:false}); }
function tcls(t){ return t==null?'':t>=80?'bad':t>=70?'warn':'ok'; }
function n0(v,suf=''){ return v==null||isNaN(v)?'—':Math.round(v)+suf; }
const fname = id => (S.st.flights.find(f=>f.id==id)||{}).name;
const oname = id => (S.st.ocs.find(f=>f.id==id)||{}).name;
const rname = id => id==='*'?'全部矿机':((S.st.rigs.find(r=>r.id===id)||{}).name||id);

function rigSum(r){
  const st=r.stats||{}, m=st.miner||{}, g=st.gpus||[];
  const temps=g.map(x=>x.temp).filter(v=>v!=null);
  return {m, g, hs:m.hs_total||0, power:g.reduce((a,x)=>a+(x.power||0),0), tmax:temps.length?Math.max(...temps):null,
    state: !r.online?'off': st.temp_hold?'hot': m.running?((m.hs_total||0)>0?'mining':'zero'):'stopped'};
}
const STATE_TXT={off:'离线',hot:'超温停机',mining:'挖矿中',zero:'启动中/零算力',stopped:'已停止'};

/* ---------------------------------------------------------- login */
function showLogin(){ $('#login').classList.add('on'); setTimeout(()=>$('#lpw').focus(),50); }
async function doLogin(){
  try{ await api('login',{password:$('#lpw').value}); $('#login').classList.remove('on'); $('#lpw').value=''; refresh(true); }
  catch(e){ toast(e.message,'err'); }
}
$('#lbtn').onclick=doLogin; $('#lpw').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
$('#logout').onclick=async()=>{ await fetch(BASE+'api/logout'); showLogin(); };

/* ---------------------------------------------------------- refresh */
async function refresh(full){
  try{ S.st = await api('state'); }catch(e){ return; }
  renderHeader();
  if (full || S.tab==='rigs') renderTab();
  if (S.rid) loadDetail(false);
}
function renderHeader(){
  const st=S.st; $('#ver').textContent='v'+st.version;
  const on=st.rigs.filter(r=>r.online).length; let gpus=0, pw=0; const algo={};
  st.rigs.forEach(r=>{ if(!r.online) return; const s=rigSum(r); gpus+=s.g.length; pw+=s.power; if(s.m.algo) algo[s.m.algo]=(algo[s.m.algo]||0)+s.hs; });
  $('#chips').innerHTML = `<span class="chip">在线<b>${on}/${st.rigs.length}</b></span><span class="chip">GPU<b>${gpus}</b></span><span class="chip">功耗<b>${(pw/1000).toFixed(2)} kW</b></span>`
    + Object.entries(algo).map(([a,v])=>`<span class="chip hs">${esc(a)}<b>${fmtHs(v)}</b></span>`).join('');
  $('#clock').textContent = st.local_time;
}
$('#nav').onclick=e=>{ const a=e.target.closest('a'); if(!a) return; S.tab=a.dataset.tab; $$('#nav a').forEach(x=>x.classList.toggle('on',x===a)); renderTab(); if(S.tab==='events') loadEvents(); };

function renderTab(){
  const f={rigs:vRigs,flights:vFlights,ocs:vOcs,schedules:vSched,events:()=>'<div id="evbox" class="tbl"><div class="empty">加载中…</div></div>',settings:vSettings}[S.tab];
  if (S.tab==='settings' && $('#main').contains(document.activeElement) && document.activeElement.tagName==='INPUT') return;
  $('#main').innerHTML=f();
  if (S.tab==='rigs') bindRigs();
}

/* ---------------------------------------------------------- 矿机列表 */
function vRigs(){
  const rigs=S.st.rigs;
  if(!rigs.length) return `<div class="card empty"><h2>还没有矿机接入</h2><p>在每台 Ubuntu 矿机上执行【设置】页里的一键安装命令，矿机会自动出现在这里。</p><button class="btn primary" onclick="goTab('settings')">查看安装命令</button></div>`;
  S.sel.forEach(id=>{ if(!rigs.find(r=>r.id===id)) S.sel.delete(id); });
  const bulk=['start_miner','stop_miner','restart_miner','reboot','shutdown','wol'].map(a=>`<button class="btn sm ${a==='shutdown'||a==='reboot'?'danger':''}" data-bulk="${a}" ${S.sel.size?'':'disabled'}>${ACT[a]}</button>`).join('');
  return `<div class="toolbar"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="selAll" ${S.sel.size&&S.sel.size===rigs.length?'checked':''}> 全选</label>
    <span class="muted">${S.sel.size?'已选 '+S.sel.size+' 台':'勾选矿机可批量操作'}</span><span class="sp"></span>${bulk}</div>
    <div id="rigList">${rigs.map(rigCard).join('')}</div>`;
}
function rigCard(r){
  const s=rigSum(r), m=s.m;
  const sub=[r.ip, m.algo?`<span class="tag algo">${esc(m.algo)}</span>`:'', fname(r.flight_id)?`<span class="tag">✈ ${esc(fname(r.flight_id))}</span>`:'<span class="tag">未分配飞行表</span>', oname(r.oc_id)?`<span class="tag">⚙ ${esc(oname(r.oc_id))}</span>`:''].filter(Boolean).join(' ');
  const kp = r.online ? `<div class="kpis">
     <div class="kpi"><label>总算力</label><b class="hs">${fmtHs(s.hs)}</b></div>
     <div class="kpi"><label>功耗</label><b>${n0(s.power,' W')}</b></div>
     <div class="kpi"><label>最高温</label><b class="${tcls(s.tmax)}">${n0(s.tmax,'°C')}</b></div>
     <div class="kpi"><label>份额 A / R</label><b>${n0(m.accepted)} <span class="${m.rejected?'bad':'dim'}">/ ${n0(m.rejected)}</span></b></div>
     <div class="kpi"><label>矿工运行</label><b>${fmtDur(m.uptime)}</b></div></div>`
   : `<div class="kpis"><div class="kpi"><label>最后在线</label><b>${ago(r.last_seen)}</b></div></div>`;
  const acts = r.online
   ? (r.desired==='mining' ? `<button class="btn sm" data-a="stop_miner">■ 停止</button>` : `<button class="btn sm" data-a="start_miner">▶ 挖矿</button>`)
     + `<button class="btn sm" data-a="restart_miner">↻ 矿工</button><button class="btn sm danger" data-a="reboot">⟲ 重启</button><button class="btn sm danger" data-a="shutdown">⏻ 关机</button>`

function splitOc(v){ return String(v||'').trim().split(/[\s,，;；|/]+/).filter(x=>x!==''); }
function ocPerGpu(oc, gpus){

    ${gpus.map((g,i)=>`<tr><td>GPU${g.i}</td><td>${esc(g.name)}</td>${cols.map(([k])=>`<td class="mono">${esc(pick(k,i))}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function buildArgsWildrig(fl, oc, ngpu, rig, ex){
  let pool=String(fl.pool||'').trim(); if(!pool.includes('://')) pool=(+fl.tls?'stratum+ssl://':'stratum+tcp://')+pool;
  const a=['--algo',fl.algorithm,'--url',pool,'--user',String(fl.wallet).replace(/%RIG%/g,rig),'--pass',fl.password||'x','--opencl-platforms','nvidia','--api-port','21550','--api-worker-id',rig,'--no-color','--print-time','10'];
  const w=String(fl.worker||'').replace(/%RIG%/g,rig).trim(); if(w) a.push('--worker',w);
  const pre=[];
  if(oc){ [['coffset','--gpu-core-offset'],['moffset','--gpu-memory-offset'],['fan','--gpu-fan-speed']].forEach(([k,f])=>{ const v=ex(oc[k]); if(v) a.push(f,v); });
    if(oc.extra) a.push(oc.extra);
    [['cclock','-lgc'],['mclock','-lmc'],['plimit','-pl']].forEach(([k,f])=>{ const v=ex(oc[k]); if(v) pre.push(`nvidia-smi ${f} ${v}`); }); }

function buildArgs(fl, oc, ngpu, rig){
  if(!fl) return null;
  if(fl.miner==='wildrig') return buildArgsWildrig(fl, oc, ngpu, rig, (v)=>{ const p=splitOc(v); if(!p.length||!ngpu) return null; let q=p.length===1?Array(ngpu).fill(p[0]):p.concat(Array(Math.max(0,ngpu-p.length)).fill(p[p.length-1])); return q.slice(0,ngpu).join(','); });
  const a=['--disable-cpu','--algorithm',fl.algorithm,'--pool',fl.pool,'--wallet',String(fl.wallet).replace(/%RIG%/g,rig),'--api-enable','--api-port','21550','--api-rig-name',rig];
  const w=String(fl.worker||'').replace(/%RIG%/g,rig).trim(); if(w) a.push('--worker',w);
  if(fl.password) a.push('--password',fl.password); if(+fl.tls) a.push('--tls','true'); if(fl.tls_cert) a.push('--tls-cert-sha256',fl.tls_cert);
  const ex=(v)=>{ const p=splitOc(v); if(!p.length||!ngpu) return null; let q=p.length===1?Array(ngpu).fill(p[0]):p.concat(Array(Math.max(0,ngpu-p.length)).fill(p[p.length-1])); return q.slice(0,ngpu).join(','); };
  if(oc){ if(+oc.reset) a.push('--gpu-reset-oc'); const o=[]; [['cclock','--gpu-cclock0'],['mclock','--gpu-mclock0'],['coffset','--gpu-coffset0'],['moffset','--gpu-moffset0'],['plimit','--gpu-plimit0'],['fan','--gpu-fan0']].forEach(([k,f])=>{ const v=ex(oc[k]); if(v) o.push(f,v); });
    if(o.length) a.push('--gpu-id',[...Array(ngpu).keys()].join(','),...o); if(oc.extra) a.push(oc.extra); } else a.push('--gpu-reset-oc');
  if(fl.extra) a.push(fl.extra);

}

function svgChart(pts, key, color, fmt, title){
  const W=900,H=180,P=46; const v=pts.map(p=>p[key]).filter(x=>x!=null);
  if(pts.length<2||!v.length) return `<div class="chart"><h4>${title}</h4><div class="muted" style="padding:40px 0;text-align:center">数据不足（每分钟采样一次）</div></div>`;
  let mx=Math.max(...v), mn=Math.min(0,...v); if(mx===mn) mx=mn+1;
  const t0=pts[0].ts, t1=pts[pts.length-1].ts||t0+1; const X=t=>P+(t-t0)/(t1-t0||1)*(W-P-10), Y=y=>H-22-(y-mn)/(mx-mn)*(H-36);
  let path='', seg=false;
  pts.forEach((p,i)=>{ const y=p[key]; const gap=i>0&&p.ts-pts[i-1].ts>300; if(y==null||gap){seg=false; if(y==null) return;} path+=(seg?'L':'M')+X(p.ts).toFixed(1)+' '+Y(y).toFixed(1); seg=true; });
  const grid=[0,.5,1].map(f=>{ const y=mn+(mx-mn)*f; return `<line x1="${P}" x2="${W-10}" y1="${Y(y)}" y2="${Y(y)}" stroke="#222d3a"/><text x="${P-6}" y="${Y(y)+4}" fill="#7f8c9c" font-size="11" text-anchor="end">${fmt(y)}</text>`; }).join('');
  const xt=[0,.25,.5,.75,1].map(f=>{ const t=t0+(t1-t0)*f; const d=new Date(t*1000); const lab=(S.hours>24?(d.getMonth()+1)+'/'+d.getDate()+' ':'')+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); return `<text x="${X(t)}" y="${H-4}" fill="#7f8c9c" font-size="11" text-anchor="middle">${lab}</text>`; }).join('');
  const avg=v.reduce((a,b)=>a+b,0)/v.length;
  return `<div class="chart"><h4>${title} <span style="float:right">平均 ${fmt(avg)} · 最高 ${fmt(Math.max(...v))}</span></h4><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${xt}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;
}
function dChart(d){

async function runShell(){
  const cmd=$('#tcmd').value.trim(); if(!cmd) return; const box=$('#tout'); box.innerHTML='<pre class="out">下发中…</pre>'; const pre=box.firstChild;
  try{ const j=await api('rig/'+encodeURIComponent(S.rid)+'/cmd',{action:'shell',args:{cmd}}); const c=await waitCmd(j.cmd_id, pre); if(c) pre.textContent=c.result||'(无输出)'; }catch(e){ pre.textContent=e.message; }
}

   <div class="grid2">
    <div>
     <div class="note" style="font-size:12.5px">① Telegram 里找 <b>@BotFather</b> 发 <span class="mono">/newbot</span>，拿到 Bot Token 填下面并保存<br>② 打开你的机器人点 <b>Start</b>（或把它拉进群发 <span class="mono">/start</span>）<br>③ 点「获取 Chat ID」自动填入 → 保存 → 发送测试</div>
     ${inp('tg_token','Bot Token','形如 123456789:AAH...')}
     <div class="f"><label>Chat ID</label><div class="toolbar" style="margin:0;flex-wrap:nowrap"><input id="g_tg_chat" value="${esc(s.tg_chat)}" placeholder="个人是正数，群组是 -100 开头"><button class="btn" onclick="detectChat()">获取 Chat ID</button></div><div id="tgChats"></div></div>
     ${inp('tg_api','API 地址（可选）','留空 = https://api.telegram.org；服务器访问不了 Telegram 时可填反代地址')}
     <div class="frow"><div class="f"><label>每日日报</label>${chk('tg_daily','每天推送日报','平均算力、挖矿时长、耗电、最高温、警告数')}<input id="g_tg_daily_at" type="time" value="${esc(s.tg_daily_at||'09:00')}"></div>
      <div class="f"><label>定时播报矿场状态</label><input id="g_tg_report_hours" type="number" min="0" value="${esc(s.tg_report_hours||'0')}"><div class="hint">每 N 小时推送一次状态，0 = 关闭</div></div></div>
    </div>
    <div>
     <div class="f"><label>推送哪些通知</label>${TG_EV.map(e=>chk(...e)).join('')}</div>
     <div class="f"><label>算力下降报警阈值 %</label><input id="g_hs_drop_pct" type="number" min="5" max="95" value="${esc(s.hs_drop_pct||'30')}"></div>
     ${chk('tg_bot_cmds','允许机器人命令（查状态 / 启停 / 重启 / 关机）','只响应上面 Chat ID 的会话；重启和关机需在 Telegram 里二次确认')}
     <div class="dim mono" style="font-size:12px;line-height:1.7">/status /rig 名字 /report /mine /stop /restart /reboot /shutdown /wake（名字或 all）/mute 小时 /unmute</div>
    </div>
   </div>
   <div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveSet(TG_KEYS)">保存</button><button class="btn" onclick="act('settings/test_tg',{})">发送测试</button>
    <button class="btn" onclick="act('settings/tg_status_now',{})">推送当前状态</button><button class="btn" onclick="act('settings/tg_status_now',{daily:1})">推送状态 + 日报</button><span id="tgMute"></span></div></div>`;
}
async function loadTgInfo(){
  try{ const j=await api('settings/tg_info'); const st=j.status, el=$('#tgState'); if(!el) return;
    el.innerHTML = !S.st.settings.tg_token ? '未配置' : (st.bot?`机器人 <b>@${esc(st.bot)}</b> 已连接`:'正在连接机器人…') + (st.ok===false?` · <span class="bad">最近发送失败：${esc(st.err)}</span>`:st.ok?' · <span class="ok">推送正常</span>':'');
    $('#tgMute').innerHTML = j.muted?`<span class="warn">🔕 已静音至 ${tm(j.mute_until)}</span> <button class="btn sm" onclick="act('settings/tg_unmute',{}).then(loadTgInfo)">取消静音</button>`:'';
    return j;
  }catch(e){}
}
async function detectChat(){
  const j=await loadTgInfo(); const box=$('#tgChats'); if(!j) return;
  if(!S.st.settings.tg_token){ box.innerHTML='<div class="hint warn">请先填写 Bot Token 并点【保存】</div>'; return; }
  if(!j.chats.length){ box.innerHTML='<div class="hint warn">还没收到消息：请在 Telegram 里给机器人发 /start，几秒后再点一次</div>'; return; }
  box.innerHTML='<div class="hint">点击选择：</div>'+j.chats.map(c=>`<button class="btn sm" style="margin:4px 4px 0 0" onclick="$('#g_tg_chat').value='${esc(c.id)}'">${esc(c.title||c.type)} · <span class="mono">${esc(c.id)}</span></button>`).join('');
}
function copyCmd(){ const t=$('#icmd').textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已复制','okk')).catch(()=>{ const r=document.createRange(); r.selectNode($('#icmd')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('请按 Ctrl+C 复制'); }); }
async function rotateKey(){ if(!confirm('更换 Farm Key 后，所有矿机都会断开，需重新执行安装命令。确定？')) return; await act('settings/rotate_key',{},'已更换'); refresh(true); }
async function saveSet(keys){ const b={}; keys.forEach(k=>b[k]=val('g_'+k)===1?true:val('g_'+k)===0?false:val('g_'+k)); await act('settings',b,'已保存'); refresh(true); }
async function saveEntrance(){
  const v=$('#g_entrance').value.trim().replace(/^\/+|\/+$/g,'');
  const url=location.origin+'/'+(v?v+'/':'');
  if(!confirm(v?`保存后面板地址变为：\n${url}\n\n请先收藏这个地址，旧地址将无法访问。确定？`:'确定关闭安全入口？面板将可以从根地址访问。')) return;
  await act('settings',{entrance:v},'已保存，正在跳转…'); setTimeout(()=>location.href=url, 800);
}
async function changePw(){ const pw=$('#g_pw').value; const j=await act('settings',{new_password:pw},'密码已修改，请重新登录'); if(j.relogin) showLogin(); }

/* ---------------------------------------------------------- 启动 */
refresh(true);
setInterval(()=>{ if(!document.hidden && !$('#login').classList.contains('on')) refresh(false); }, 8000);
setInterval(()=>{ if(S.tab==='events' && !document.hidden) loadEvents(); }, 15000);
</script>
</body>
</html>
